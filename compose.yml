# LOOGI — Docker Compose (production: VPS behind a shared Caddy edge proxy, ADR 0029)
# TLS/domain (loogi.ch) is handled by the edge proxy; the container joins its
# Docker network "edge" and is reachable by name: loogi:8080. No ports: —
# the edge proxy is the only way in (ADR 0008/0029).
# The image is built on the server (`docker compose build`; BRAVE_API_KEY
# patched in at build time, base version pinned in the Dockerfile, ADR 0023).
name: loogi

services:
  searxng:
    build:
      context: .
      args:
        # Brave Search API key — patched into /etc/loogi/settings.yml at
        # build time. Sourced from the local .env (gitignored). Empty
        # default = the engine disables itself on init (no crash). ADR 0016.
        BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    image: loogi:latest
    container_name: loogi
    hostname: loogi
    restart: unless-stopped
    networks:
      - caddy
      - loogi-internal
    environment:
      - SEARXNG_BASE_URL=https://loogi.ch/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - INSTANCE_NAME=LOOGI
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      # Send X-Forwarded-For: without it, bot detection logs "X-Forwarded-For
      # nor X-Real-IP header is set!" on the first health check after every
      # start (only once per process) — and thereby swallows exactly the
      # message that would reveal a real proxy misconfiguration.
      test: ["CMD", "wget", "-q", "--spider", "--header=X-Forwarded-For: 127.0.0.1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: loogi-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    networks:
      - loogi-internal
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Docker network of the shared Caddy edge proxy (separate stack), joined
  # as external (ADR 0029). Create it once with: docker network create edge
  caddy:
    external: true
    name: edge
  # Backend-only network for valkey. internal=true ⇒ no internet access
  # for containers in here (valkey doesn't need any).
  loogi-internal:
    driver: bridge
    internal: true

volumes:
  valkey-data:
