{% from 'loogi/macros.html' import result_header, result_footer with context %}

{{ result_header(result, favicons, image_proxify) -}}
{%- if result.content -%}
  <p class="content">{{ result.content|safe }}</p>
{%- elif result.metadata -%}
  <p class="content">{{ result.metadata }}</p>
{%- endif -%}
{{- result_footer(result) }}
