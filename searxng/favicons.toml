# LOOGI — favicon configuration (belongs to search.favicon_resolver in
# settings.yml). Found via the SEARXNG_SETTINGS_PATH folder (/etc/loogi).
# The file exists for two reasons:
#   1. Without it, favicons.init() logs "ERROR ... missing favicon config"
#      on every start (and falls back to built-in defaults — functionally
#      fine, but log noise).
#   2. db_url: the default would be /tmp/faviconcache.db (ephemeral, gone
#      on every recreate) — instead we put the cache on the data volume
#      /var/cache/searxng (declared as a VOLUME by the upstream image).
# All other values = upstream default (left commented out).

[favicons]

cfg_schema = 1   # config's schema version no.

[favicons.proxy]

# max_age = 5184000             # 60 days / default: 7 days (604800 sec)

[favicons.cache]

db_url = "/var/cache/searxng/faviconcache.db"  # default: "/tmp/faviconcache.db"
# HOLD_TIME = 5184000                            # 60 days / default: 30 days
# LIMIT_TOTAL_BYTES = 2147483648                 # 2 GB / default: 50 MB
# BLOB_MAX_BYTES = 40960                         # 40 KB / default 20 KB
# MAINTENANCE_MODE = "off"                       # default: "auto"
# MAINTENANCE_PERIOD = 600                       # 10min / default: 1h
